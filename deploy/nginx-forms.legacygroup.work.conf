# nginx config для forms.legacygroup.work
# Положить в /etc/nginx/sites-available/forms.legacygroup.work, потом скопировать
# в /etc/nginx/sites-enabled/forms.legacygroup.work (символическую ссылку или копию).
# ВАЖНО: на этом сервере sites-enabled — не symlink, а отдельный файл. Менять надо в sites-enabled!
# (Memory note: reference_nginx_sites_enabled.md)

server {
    listen 80;
    listen [::]:80;
    server_name forms.legacygroup.work;

    # Для certbot --webroot и редирект всего остального на HTTPS (certbot сам добавит при первом запуске)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forms.legacygroup.work;

    # certbot заполнит после запуска `certbot --nginx -d forms.legacygroup.work`
    ssl_certificate /etc/letsencrypt/live/forms.legacygroup.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forms.legacygroup.work/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Лимит на upload (на случай больших вложений в форме)
    client_max_body_size 10M;

    # Логи
    access_log /var/log/nginx/forms.legacygroup.work.access.log;
    error_log /var/log/nginx/forms.legacygroup.work.error.log;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
